<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dove l'ho messo?</title>
<meta name="description" content="Ritrova le cose che usi di rado: salvi il posto con una frase o una foto, lo ritrovi cercando il nome.">
<link rel="manifest" href="manifest.webmanifest?v=1">
<meta name="theme-color" content="#24493d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dove?">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="icons/dove-touch-180.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icons/dove-192.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: colonna unica da telefono; in alto la ricerca grande, sotto il posto trovato come un cartellino. */
:root{
  --bg:#f1f3ef; --surface:#ffffff; --ink:#1a2420; --muted:#5d6a64; --line:#d9dfd9; --soft:#f6f8f5;
  --accent:#24493d; --accent-fg:#ffffff; --tag:#f2a93b; --tag-soft:#fdf0d9; --tag-ink:#5a3a00;
  --ok:#2f7a4f; --danger:#b3261e;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211d; --ink:#e8eee9; --muted:#9fada6; --line:#2c3631; --soft:#151b18;
  --accent:#8fcdb4; --accent-fg:#0f1d17; --tag:#f2a93b; --tag-soft:#3a2c12; --tag-ink:#ffd18a;
  --ok:#5cc28a; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --ink:#e8eee9; --muted:#9fada6; --line:#2c3631; --soft:#151b18;
  --accent:#8fcdb4; --accent-fg:#0f1d17; --tag:#f2a93b; --tag-soft:#3a2c12; --tag-ink:#ffd18a;
  --ok:#5cc28a; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
svg{fill:currentColor}
.top{position:sticky;top:0;z-index:20;background:#24493d;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:640px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;padding-bottom:10px}
.brand svg{width:24px;height:24px;fill:#f2a93b}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:-.01em}
.nav{display:flex;gap:2px}
.nav a{color:#fff;opacity:.72;text-decoration:none;font-weight:600;font-size:14px;padding:8px 10px 11px;border-bottom:3px solid transparent}
.nav a.on{opacity:1;border-color:#f2a93b}
.nav a:focus-visible{outline:2px solid #f2a93b;outline-offset:-2px}
main{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h2{font:800 30px/1.05 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h3{font:600 19px/1.2 var(--f-display);margin:0 0 10px}
h3.sec{margin:8px 0 0;display:flex;gap:8px;align-items:baseline}
h3 small{font:500 14px var(--f-body);color:var(--muted)}
.meta{color:var(--muted);font-size:14.5px;margin:6px 0 0}
.head{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.back{font-weight:600;text-decoration:none;padding:6px 0;font-size:15.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 var(--f-body);min-height:46px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn svg{width:19px;height:19px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{min-height:54px;font-size:16.5px;border-radius:14px}
.btn.wide{width:100%}
.btn:focus-visible,.icon:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,.item:focus-visible,.hit:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.icon{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:46px;height:46px;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon svg{width:20px;height:20px}
.icon.big{width:54px;height:54px;border-radius:14px}
.icon.mic.on{background:#c0392b;border-color:#c0392b;color:#fff}
.link{appearance:none;border:0;background:none;color:var(--accent);font:600 15px var(--f-body);padding:8px 0;cursor:pointer}
.danger{display:flex;justify-content:center}
.danger .link{color:var(--danger)}
input,textarea{width:100%;font:16px/1.4 var(--f-body);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0}
textarea{resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld>span small{text-transform:none;letter-spacing:0;font-weight:500}
.dict{display:flex;gap:10px;align-items:flex-start}
.search{display:flex;gap:10px}
.search input{font-size:18px;min-height:56px;border-radius:16px;background:var(--surface);border-width:2px;padding:0 16px}
.search input:focus{border-color:var(--accent)}
.search .icon{width:56px;height:56px;border-radius:16px}
.intro{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.intro p{margin:0;color:var(--muted);max-width:46ch;font-size:16.5px}
.intro h3{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14.5px/1.2 var(--f-body);padding:10px 13px;border-radius:999px;cursor:pointer;text-decoration:none}
.chip.ok{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.chips.small .chip{font-size:13.5px;padding:7px 11px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-decoration:none;color:var(--ink)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--tag-soft);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--tag)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:24px;height:24px}
.item-main{display:flex;flex-direction:column;min-width:0;gap:1px}
.item-main b{font-size:16px;overflow-wrap:anywhere}
.item-main .posto{font-size:14.5px;overflow-wrap:anywhere}
.item-main small{color:var(--muted);font-size:12.5px}
.lent{font-style:normal;color:var(--tag-ink);background:var(--tag-soft);border-radius:4px;padding:1px 5px;font-size:12.5px;font-weight:600;align-self:flex-start}
.hit{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--accent);border-radius:18px;overflow:hidden;text-decoration:none;color:var(--ink)}
.hit img{width:100%;max-height:300px;object-fit:cover;display:block}
.hit-txt{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;position:relative}
.hit-txt::before{content:"";position:absolute;left:16px;top:-9px;width:18px;height:18px;background:var(--tag);transform:rotate(45deg);border-radius:3px}
.hit:not(:has(img)) .hit-txt::before{display:none}
.lab{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.where{font:800 25px/1.15 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.hit small{color:var(--muted)}
.none{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.none p{margin:0}
.detail{display:flex;flex-direction:column;gap:12px}
.detail img.big{width:100%;max-height:360px;object-fit:cover;border-radius:16px;display:block}
.where-box{display:flex;gap:12px;align-items:flex-start;background:var(--tag-soft);border-radius:14px;padding:14px}
.where-box svg{width:26px;height:26px;color:var(--tag);flex:none;margin-top:2px}
.where-box div{display:flex;flex-direction:column;min-width:0}
.where-box b{font:800 24px/1.15 var(--f-display);overflow-wrap:anywhere}
.note{margin:0;color:var(--muted)}
.lent-box{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--tag);border-radius:14px;padding:12px 14px;flex-wrap:wrap}
.lent-box div{display:flex;flex-direction:column}
.lent-box b{font-size:17px}
.lent-box small{color:var(--muted)}
.newplace{display:flex;gap:8px}
.newplace input{flex:1}
.newplace .btn{flex:none}
.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block}
.photo:empty{display:none}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0;font-size:15px}
.hist li:first-child{border-top:0}
.hist small{color:var(--muted);white-space:nowrap}
#toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:#1a2420;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;font-size:14.5px;width:max-content;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast button{appearance:none;border:0;background:none;color:#f2a93b;font:700 14.5px var(--f-body);cursor:pointer;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg><b>Dove l'ho messo?</b></div>
  <nav class="nav"><a href="#cerca" data-v="cerca">Cerca</a><a href="#nuovo" data-v="nuovo">Salva</a><a href="#altro" data-v="altro">Altro</a></nav>
</div></header>
<main id="view" aria-live="polite"></main>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
